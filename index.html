<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Chatbot Cá Nhân</title>
    <style>
        body { font-family: Arial; padding: 20px; background: #121212; color: #fff; max-width: 800px; margin: auto; }
        #chatbox { height: 400px; border: 1px solid #333; padding: 15px; overflow-y: auto; background: #1e1e1e; border-radius: 8px; margin-bottom: 10px; }
        .user-msg { color: #4dabf7; margin-bottom: 10px; }
        .ai-msg { color: #69db7c; margin-bottom: 15px; border-bottom: 1px solid #333; padding-bottom: 10px; }
        input, button { padding: 10px; border-radius: 5px; border: none; font-size: 16px; }
        input { width: 75%; background: #2d2d2d; color: white; margin-right: 5px; }
        button { background: #0b7285; color: white; cursor: pointer; font-weight: bold; width: 20%; }
        button:hover { background: #1098ad; }
    </style>
</head>
<body>
    <h2>🤖 Trợ lý AI Gemini</h2>
    <div id="chatbox"></div>
    <div style="display: flex;">
        <input type="text" id="userInput" placeholder="Nhập câu hỏi tại đây...">
        <button onclick="askAI()" id="sendBtn">Gửi</button>
    </div>

    <script>
        async function askAI() {
            const input = document.getElementById("userInput");
            const chatbox = document.getElementById("chatbox");
            const btn = document.getElementById("sendBtn");

            if(!input.value.trim()) return;

            // In câu hỏi của bạn ra
            chatbox.innerHTML += `<div class="user-msg"><b>Bạn:</b> ${input.value}</div>`;
            const question = input.value;
            input.value = "";
            btn.innerText = "Đang gõ...";
            btn.disabled = true;

            try {
                // Gọi API ngầm qua server Netlify (Bảo mật 100%)
                const response = await fetch("/.netlify/functions/chat", {
                    method: "POST",
                    body: JSON.stringify({ message: question })
                });
                const data = await response.json();
                
                // In câu trả lời của AI ra
                // Lệnh replace giúp đổi dấu xuống dòng của AI thành thẻ <br> của HTML
                chatbox.innerHTML += `<div class="ai-msg"><b>AI:</b><br>${data.reply.replace(/\n/g, '<br>')}</div>`;
            } catch (error) {
                chatbox.innerHTML += `<div class="ai-msg" style="color:red;">Lỗi mạng hoặc Backend!</div>`;
            }
            
            chatbox.scrollTop = chatbox.scrollHeight;
            btn.innerText = "Gửi";
            btn.disabled = false;
        }
        
        document.getElementById("userInput").addEventListener("keypress", function(e) {
            if (e.key === "Enter") askAI();
        });
    </script>
</body>
</html>
